name: Repository Validation

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java for PySpark notebook tests
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Validate required folders
        run: |
          test -d architecture
          test -d config
          test -d data/sample
          test -d notebooks
          test -d src
          test -d sql
          test -d powerbi
          test -d pipelines
          test -d deployment
          test -d docs
          test -d tests

      - name: Validate required files
        run: |
          test -f README.md
          test -f config/source_config.csv
          test -f sql/create_control_tables.sql
          test -f sql/create_logging_tables.sql
          test -f sql/create_watermark_tables.sql

      - name: Check that secrets are not committed
        run: |
          python - <<'PY'
          import sys
          from src.deployment_utils import find_secret_files
          findings = find_secret_files(".")
          for path in findings:
              print(f"Potential secret file: {path}")
          sys.exit(1 if findings else 0)
          PY

      - name: Compile Python files
        run: |
          python -m compileall src notebooks tests

      - name: Run unit tests
        run: |
          pytest
