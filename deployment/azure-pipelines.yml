trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

parameters:
  - name: releaseVersion
    type: string
    default: "1.0.0"

stages:
  - stage: Validate
    jobs:
      - job: EndToEndValidation
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: "3.11"
          - script: python -m pip install -r requirements.txt
            displayName: Install dependencies
          - script: python notebooks/07_run_end_to_end_pipeline.py
            displayName: Run end-to-end validation
          # Validate every promotion target up front so Test and Prod are never promoted on Dev-only evidence.
          - script: |
              set -e
              for environment in dev test prod; do
                python scripts/validate_release.py --environment "$environment"
              done
            displayName: Validate release structure for dev, test, and prod
          - script: |
              set -e
              for environment in dev test prod; do
                python scripts/check_deployment_gates.py --environment "$environment" --write-evidence
              done
            displayName: Evaluate deployment gates for dev, test, and prod
          - script: python scripts/create_release_package.py --version "$RELEASE_VERSION"
            displayName: Create release package
            env:
              RELEASE_VERSION: ${{ parameters.releaseVersion }}
          - publish: dist
            artifact: fabric-release

  - stage: DevApproval
    dependsOn: Validate
    jobs:
      - deployment: ApproveDevPromotion
        environment: fabric-dev
        strategy:
          runOnce:
            deploy:
              steps:
                - script: echo "Promote Development stage through the Fabric deployment pipeline."

  - stage: TestApproval
    dependsOn: DevApproval
    jobs:
      - deployment: ApproveTestPromotion
        environment: fabric-test
        strategy:
          runOnce:
            deploy:
              steps:
                - script: echo "Promote Development to Test after validation."

  - stage: ProdApproval
    dependsOn: TestApproval
    jobs:
      - deployment: ApproveProdPromotion
        environment: fabric-prod
        strategy:
          runOnce:
            deploy:
              steps:
                - script: echo "Promote Test to Production after approval."
